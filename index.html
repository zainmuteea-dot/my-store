<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>متجر الشامل - من اليمن إلى العالم</title>
  <style>
    body { background: #8F5F5F; margin: 0; font-family: Tahoma; }
    h1 { color: #8333CC; text-align: center; }
    .منتج { background: rgba(0,0,0,0.1); border-radius: 10px; padding: 10px; margin: 10px; text-align: center; width: 200px; display: inline-block; }
    .منتج img { width: 100%; border-radius: 8px; }
    .سعر { color: #8E91E63; font-size: 18px; font-weight: bold; }
    .زر { background: #4CAF50; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; }
    .شبكة { text-align: center; }
  </style>
</head>
<body>
  <h1>🛒 متجر التسوق الشامل</h1>
  <div class="شبكة">
    <div class="منتج">
      <img src="https://via.placeholder.com/300">
      <h3>قميص</h3>
      <p>سعر: 100﷼</p>
      <button class="زر">اطلب الان</button>
    </div>
    <div class="منتج">
      <img src="https://via.placeholder.com/300">
      <h3>بنطلون</h3>
      <p>سعر: 150﷼</p>
      <button class="زر">اطلب الان</button>
    </div>
    <div class="منتج">
      <img src="https://via.placeholder.com/300">
      <h3>فستان</h3>
      <p>سعر: 200﷼</p>
      <button class="زر">اطلب الان</button>
    </div>
  </div>
</body>
</html>
